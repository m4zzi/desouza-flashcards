<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">

<meta property="og:type" content="website">
<meta property="og:url" content="https://flashcards-for-residents.web.app/">
<meta property="og:title" content="Flashcards for Residents">

<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Lora',serif;
  background:#fafaf8;
  color:#1a1a18;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:2rem;
  line-height:1.6;
}
@media(prefers-color-scheme:dark){
  body{background:#181816;color:#f0efe8}
}
.card{
  max-width:440px;
  text-align:center;
}
.icon{
  width:120px;
  height:120px;
  border-radius:24px;
  margin:0 auto 1.5rem;
  display:block;
  box-shadow:0 8px 24px rgba(0,0,0,0.08);
}
h1{
  font-size:24px;
  font-weight:600;
  font-style:italic;
  margin-bottom:0.75rem;
  letter-spacing:-0.3px;
}
p{
  color:#6b6b67;
  font-size:15px;
  margin-bottom:1.5rem;
}
@media(prefers-color-scheme:dark){
  p{color:#9a9a96}
}
a.btn{
  display:inline-block;
  background:#21C8FD;
  color:#fff;
  text-decoration:none;
  padding:12px 24px;
  border-radius:10px;
  font-weight:600;
  font-family:'Lora',serif;
  transition:transform .15s, box-shadow .15s;
}
a.btn:hover{
  transform:translateY(-1px);
  box-shadow:0 6px 16px rgba(33,200,253,0.35);
}
.note{
  margin-top:2rem;
  font-size:13px;
  color:#9a9a96;
}
</style>
</head>
<body>
<main class="card">
  <img src="icons/icon-512.png" alt="" class="icon">
  <h1>This has moved</h1>
  <p>Flashcards for Residents now lives at a new home. You'll be redirected automatically.</p>
  <a class="btn" href="https://flashcards-for-residents.web.app/">Go to the new site</a>
  <p class="note">flashcards-for-residents.web.app</p>
</main>
<script>
  window.location.replace('https://flashcards-for-residents.web.app/' + window.location.search + window.location.hash);
</script>
</body>
</html>
